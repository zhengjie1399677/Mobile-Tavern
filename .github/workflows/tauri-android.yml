name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: '是否同时创建 GitHub Release（仅手动触发时生效；tag 触发始终发布）'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  NO_PROXY: localhost,127.0.0.1,::1
  _JAVA_OPTIONS: -Djava.net.preferIPv4Stack=true
  GRADLE_OPTS: -Djava.net.preferIPv4Stack=true
  VITE_COMMUNITY_ENABLED: 'true'
  VITE_COMMUNITY_ORIGIN: 'https://community.neural-node.xyz'
  VITE_COMMUNITY_MIN_FIRST_USE_AGE_DAYS: '0'
  VITE_COMMUNITY_MIN_CUMULATIVE_USAGE_HOURS: '0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate Android signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
        run: |
          set -euo pipefail
          missing=0
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required Android signing secret is missing: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install npm dependencies
        run: npm install

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'tools platform-tools ndk;29.0.14206865'

      - name: Set NDK environment
        run: |
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install Pillow

      - name: Generate and Sync Tauri Icons
        run: |
          node scripts/decode_icon.cjs

      - name: Fix gradlew permissions
        run: chmod +x src-tauri/gen/android/gradlew

      - name: Cache Gradle distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ runner.os }}-${{ hashFiles('src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-wrapper-${{ runner.os }}-

      - name: Cache Gradle caches
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-caches-${{ runner.os }}-${{ hashFiles('src-tauri/gen/android/**/*.gradle*', 'src-tauri/gen/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-caches-${{ runner.os }}-

      - name: Pre-warm Gradle distribution
        run: cd src-tauri/gen/android && ./gradlew --version

      - name: Build Android APK
        run: npm run build:android

      - name: Sign and Prepare APK
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
        run: |
          set -euo pipefail
          apk_path=$(find src-tauri/gen/android/app/build/outputs/apk -type f -path "*/release/*.apk" -print -quit)
          if [ -z "$apk_path" ]; then
            echo "::error::Release APK not found; refusing to publish a debug or unknown build"
            exit 1
          fi

          build_tools_dir=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          if [ -z "$build_tools_dir" ]; then
            echo "::error::Android build-tools not found"
            exit 1
          fi

          keystore_path="$RUNNER_TEMP/mobile-tavern-release.keystore"
          trap 'rm -f "$keystore_path"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keystore_path"
          if [ ! -s "$keystore_path" ]; then
            echo "::error::Decoded Android keystore is empty"
            exit 1
          fi

          echo "Signing release APK: $apk_path"
          "$build_tools_dir/zipalign" -v -f 4 "$apk_path" MobileTavern.apk
          "$build_tools_dir/apksigner" sign \
            --ks "$keystore_path" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEYSTORE_PASSWORD" \
            MobileTavern.apk
          "$build_tools_dir/apksigner" verify --verbose --print-certs MobileTavern.apk
          sha256sum MobileTavern.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-tavern-release.apk
          path: MobileTavern.apk

      - name: Publish APK to Release
        # tag 推送自动发布；手动触发时默认只出构建产物，不创建 Release。
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: MobileTavern.apk
          fail_on_unmatched_files: true
