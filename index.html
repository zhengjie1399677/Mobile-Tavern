<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- 静态声明 color-scheme：避免 Android WebView 在应用接管主题前做"算法深色"，
       那会让部分机型整屏变暗、文字对比度崩塌，而基于计算样式的自检完全看不到。 -->
  <meta name="color-scheme" content="dark light" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
  <title>Mobile-Tavern</title>
  <style>
    /* 引导底色：仅用于 React 挂载前避免白闪，必须让主题变量接管（`var(--background)`）。
       此前这里是硬编码 `#0d1726 !important`，会把 index.css 的 `html,body{bg-background}`
       永久压掉——任何"内容区没画上底色"的瞬间（面板 display:none、加载兜底、子树未挂载）
       都会暴露成整块深蓝/近黑，而环境光晕照旧画在上面，现场看起来就是"整屏发黑"。
       变量尚未定义时（首帧前）才回落到原来的深蓝。 */
    html, body {
      /* 静态兜底在前、变量在后：旧 WebView 不认识 oklch() 时 `var(--background)` 会整条失效，
         background-color 会退化成透明（"整屏发白/发黑 + 面板没底色"），因此必须先给一个
         一定认识的颜色，再让支持新语法的环境用主题变量覆盖。 */
      background-color: #0d1726;
      background-color: var(--background, #0d1726);
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }
  </style>
  <script>
    (function() {
      var theme = localStorage.getItem("mobile_tavern_theme") || localStorage.getItem("siuser-theme") || "ocean";
      document.documentElement.setAttribute("data-theme", theme);
      
      var bg = "#0d1726"; // 默认 ocean (荧光深海)
      if (theme === "ocean") {
        bg = "#0d1726";
      } else if (theme === "obsidian") {
        bg = "#0f0f12";
      } else if (theme === "snow") {
        bg = "#f8fafc";
      } else if (theme === "sand") {
        bg = "#f5f5f4";
      }
      
      // 若非默认的 ocean 主题，则动态覆盖背景色
      if (theme !== "ocean") {
        document.documentElement.style.backgroundColor = bg;
        var style = document.createElement('style');
        style.innerHTML = 'html, body { background-color: ' + bg + ' !important; }';
        document.documentElement.appendChild(style);
      }
      
      if (theme === "ocean" || theme === "obsidian") {
        document.documentElement.classList.add("dark");
        document.documentElement.style.colorScheme = "dark";
      } else {
        document.documentElement.classList.remove("dark");
        document.documentElement.style.colorScheme = "light";
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
