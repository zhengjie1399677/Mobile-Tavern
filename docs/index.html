  <script>
    const portalMount = document.getElementById('portal-tut-mount');
    const portalTabs = document.getElementById('portal-tut-tabs');
    const ptplIds = [
      'ptpl-tut-quickstart',
      'ptpl-tut-api',
      'ptpl-tut-css',
      'ptpl-tut-cards',
      'ptpl-tut-chat',
      'ptpl-tut-branches',
      'ptpl-tut-worldbook',
      'ptpl-tut-plugins'
    ];

    function renderPortalTutorials(category = 'all') {
      if (!portalMount) return;
      portalMount.innerHTML = '';

      ptplIds.forEach((id) => {
        const tpl = document.getElementById(id);
        if (!tpl) return;

        const clone = tpl.content.cloneNode(true);
        const card = clone.querySelector('.portal-tut-card');
        if (!card) return;

        const cat = card.getAttribute('data-cat');
        if (category !== 'all' && cat !== category) return;

        portalMount.appendChild(card);
      });
    }

    if (portalTabs) {
      const btns = portalTabs.querySelectorAll('button');
      btns.forEach((btn) => {
        btn.addEventListener('click', () => {
          btns.forEach((b) => {
            b.classList.remove('text-white', 'bg-indigo-500/30', 'border-indigo-500/40', 'active-tab');
            b.classList.add('text-zinc-400', 'hover:text-white');
          });
          btn.classList.remove('text-zinc-400', 'hover:text-white');
          btn.classList.add('text-white', 'bg-indigo-500/30', 'border-indigo-500/40', 'active-tab');
          renderPortalTutorials(btn.getAttribute('data-target') || 'all');
        });
      });
    }

    renderPortalTutorials('all');
  </script>
