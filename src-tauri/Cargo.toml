[package]
name = "app"
version = "1.8.9"
description = "A Tauri App"
authors = ["you"]
license = "Apache-2.0"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
# Local plugin that injects the AndroidThemeBridge JavascriptInterface into
# the WebView for native safe-area / status-bar / MediaStore file-save support.
# Path-based dependency so the Kotlin sources are version-controlled.
tauri-plugin-android-bridge = { path = "./plugins/android-bridge" }
# Local plugin that provides real ARCore spatial anchoring for character
# cards, running in a full-screen Android Activity (billboard + shadow +
# AR lighting + procedural micro-animation + chat bubble).
# 暂缓上线：在此注释以彻底从打包中剥离相机敏感权限。需要本地测试 AR 时请解开此注释。
# tauri-plugin-tavern-ar = { path = "./plugins/tavern-ar" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
md5 = "0.7"
# AES-GCM 解密 trial key 密文，剥离 JS bundle 中的 AES key 与解密逻辑。
# 仅用于解密云端下发的临时 trial key，不涉及用户数据加密。
aes-gcm = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["fs", "time", "sync", "rt-multi-thread"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true
